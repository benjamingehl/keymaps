name: Build firmware

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: keymaps-qmk:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create env.h
        run: cp benjamingehl/env.h.example benjamingehl/env.h

      - name: Create build directory
        run: mkdir -p build

      - name: Compile firmware
        run: docker compose run --rm qmk

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: firmware
          path: build/
          if-no-files-found: warn
