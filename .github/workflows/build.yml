name: Build firmware

on:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: keymaps-qmk:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create env.h
        run: cp benjamingehl/env.h.example benjamingehl/env.h

      - name: Create build directory
        run: mkdir -p build

      - name: Compile firmware
        id: compile
        run: |
          docker compose run --rm qmk 2>&1 | tee /tmp/build.log
          exit ${PIPESTATUS[0]}

      - name: Post compile log on failure
        if: failure() && steps.compile.outcome == 'failure'
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const log = fs.readFileSync('/tmp/build.log', 'utf8');
            const tail = log.slice(-8000);
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `## Build failed\n\`\`\`\n${tail}\n\`\`\``
            });

      - name: Upload firmware
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: firmware
          path: build/
          if-no-files-found: warn
